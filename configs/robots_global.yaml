global_settings:
  system_name: VESTA-Autonomous-Trading-System
  version: 2.1.0
  timezone: Asia/Ho_Chi_Minh
  database:
    target_path: d:/VESTA/db/vesta.duckdb
    staging_schema: staging
    core_schema: core
    meta_schema: meta
  network:
    default_user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0
      Safari/537.36 (VESTA-Quant-Crawler/2.1)
    request_timeout_seconds: 15
    max_retries: 4
    backoff_factor: 1.5
    retry_http_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504
  lookahead_bias_guardrails:
    enabled: true
    bctc_disclosure_lag_days: 30
    news_publication_lag_minutes: 0
  time_cost_optimization:
    watermark_incremental: true
    stop_on_watermark_hit: true
    max_daily_runtime_minutes: 45
    sitemap_delta_check: true
tier1_vnstock_api:
  provider: vnstock / vnstock_data
  api_key_env: VNSTOCK_API_KEY
  rate_limit:
    calls_per_minute: 60
    pause_on_rate_limit_seconds: 45
  modules:
    dim_symbol:
      target_table: core.dim_symbol
      module_path: src/crawlers/dim_symbol.py
      schedule: 08:00 daily (Mon-Fri)
      exchanges:
      - HOSE
      - HNX
      - UPCOM
      description: Universe directory master (1,751 symbols total, 1,522 active listed equities)
    market_ohlcv:
      target_table: core.market_ohlcv_daily
      module_path: src/crawlers/market_ohlcv.py
      schedule: 15:35 daily (Mon-Fri)
      lookback_days_incremental: 3
      full_history_start: '2020-01-01'
      description: Daily open, high, low, close, volume price series
    corporate_news:
      target_table: core.news
      module_path: src/crawlers/vnstock_news.py
      schedule: Every 2 hours (08:30 - 18:30)
      source_label: vnstock_news
      description: Ticker-tagged news and corporate press releases
    fundamentals:
      target_table: core.fundamentals
      module_path: src/crawlers/fundamentals.py
      schedule: 18:00 daily during earnings season (Jan, Apr, Jul, Oct)
      report_types:
      - income_statement
      - cash_flow
      - ratios
      source_label: vnstock_data
      note: Primary BCTC source. Balance sheet gap is filled by CafeF in Tier 2.
    corporate_events:
      target_table: core.corporate_events
      module_path: src/crawlers/corporate_events.py
      schedule: 17:00 daily (Mon-Fri)
      event_types:
      - DIVIDEND_CASH
      - DIVIDEND_STOCK
      - BONUS_SHARE
      - RIGHTS_ISSUE
      - AGM
      description: Corporate actions and dividend payout tracking
    quote_snapshots:
      target_table: core.quote_snapshots
      module_path: src/crawlers/snapshots.py
      schedule: 11:35 & 15:05 daily (Mon-Fri)
      description: Intraday quote board, bid-ask spread, valuation multiples (P/E, P/B)
tier2_enhancers:
  cafef:
    name: CafeF Financial Ecosystem
    base_web_url: https://cafef.vn
    base_api_url: https://apiweb.cafef.vn
    crawl_delay_seconds: 0.8
    headers:
      Origin: https://cafef.vn
      Referer: https://cafef.vn/
    features:
      balance_sheet_enhancer:
        enabled: true
        module_path: src/crawlers/cafef_finance_enhancer.py
        endpoint: /api/v2/BCTC/GetReportCDKT
        target_table: core.fundamentals
        source_label: cafef
        purpose: Populate missing balance sheet statements (CDKT) where vnstock_data returns empty
        period_type: quarter
        historical_years: 5
      article_body_enrichment:
        enabled: true
        module_path: src/crawlers/cafef_article_body.py
        target_table: core.news
        purpose: Enrich full paragraph text for headline-only corporate articles
        batch_size: 100
      market_indices:
        enabled: true
        module_path: src/crawlers/cafef_data_market.py
        target_table: core.market_index_daily
        indices:
        - VN-INDEX
        - VN30-INDEX
        - HNX-INDEX
        - UPCOM-INDEX
        purpose: Benchmark index daily bars and market breadth calculation
      foreign_flow_volume:
        enabled: true
        module_path: src/crawlers/cafef_foreign_flow.py
        target_table: core.foreign_flow_daily
        mode: volume_only
        purpose: Daily foreign investor buy/sell/net trading volume
  vietstock:
    name: Vietstock Finance Portal
    base_web_url: https://vietstock.vn
    base_finance_url: https://finance.vietstock.vn
    crawl_delay_seconds: 1.2
    features:
      equity_research_reports:
        enabled: true
        module_path: src/crawlers/vietstock_finance_enhancer.py
        target_table: core.stock_research_reports
        endpoint: https://finance.vietstock.vn/bao-cao-phan-tich/phan-tich-doanh-nghiep
        schedule: 19:00 daily (Mon-Fri)
        purpose: Broker research reports, consensus target prices, and investment ratings
        brokers_tracked:
        - VPBankS
        - SSI
        - VNDirect
        - HSC
        - Mirae Asset
        - KBSV
        - BaoViet
      financial_indicators_crossref:
        enabled: true
        module_path: src/crawlers/vietstock_finance_enhancer.py
        target_table: core.fundamentals
        purpose: Cross-validate and fill fundamental ratio metrics
