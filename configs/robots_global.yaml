daily_pipeline_schedules:
  job_01_morning_macro:
    name: Morning Macro, Legal & Overnight Global Sweep
    cron: 30 6 * * *
    target_tiers:
    - tier3.world_macro_institutions
    - tier3.macro_regulatory
    - tier3.economical_laws_policies
    max_duration_minutes: 8
    incremental_strategy: delta_watermark
  job_02_pre_market_readiness:
    name: Pre-Market Symbol Directory & Exchange Status
    cron: 15 8 * * 1-5
    target_tiers:
    - tier1_vnstock_api.modules.dim_symbol
    - tier3.macro_regulatory.hsx_vn
    - tier3.macro_regulatory.hnx_vn
    max_duration_minutes: 3
    incremental_strategy: upsert_active_universe
  job_03_intraday_news:
    name: Intraday Financial News & Corporate Disclosures
    cron: 45 11,45 14 * * 1-5
    target_tiers:
    - tier1_vnstock_api.modules.corporate_news
    - tier2_enhancers.cafef.features.article_body_enrichment
    - tier3.financial_media_portals
    max_duration_minutes: 5
    incremental_strategy: watermark_latest_timestamp
  job_04_post_market_ohlcv:
    name: Post-Market OHLCV, Quotes & Foreign Flow Volume
    cron: 35 15 * * 1-5
    target_tiers:
    - tier1_vnstock_api.modules.market_ohlcv
    - tier1_vnstock_api.modules.quote_snapshots
    - tier2_enhancers.cafef.features.foreign_flow_volume
    - tier2_enhancers.cafef.features.market_indices
    max_duration_minutes: 6
    incremental_strategy: fetch_latest_trading_date
  job_05_evening_corporate_deep_dive:
    name: Evening BCTC Enhancement, Corporate Events & Broker Research
    cron: 30 18 * * 1-5
    target_tiers:
    - tier1_vnstock_api.modules.corporate_events
    - tier2_enhancers.cafef.features.balance_sheet_enhancer
    - tier2_enhancers.vietstock.features.equity_research_reports
    max_duration_minutes: 15
    incremental_strategy: missing_symbols_queue
  job_06_weekend_comprehensive_audit:
    name: Weekend Multi-Source Macro & Association Audit
    cron: 0 20 * * 0
    target_tiers:
    - tier3.industry_associations
    - tier3.world_macro_institutions.data_worldbank_org
    max_duration_minutes: 20
    incremental_strategy: weekly_full_reconciliation
