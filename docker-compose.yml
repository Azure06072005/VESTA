version: '3.8'

services:
  vesta-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vesta-trading-console
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      - VESTA_DATA_TIER=hot
      - PORT=8899
    volumes:
      - vesta-data:/app/db/hot

volumes:
  vesta-data:
